apiVersion: apps/v1
kind: Deployment
metadata:
  name: growthos-api-deployment
  namespace: growthos
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: growthos-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: growthos-api
  template:
    metadata:
      labels:
        app: growthos-api
    spec:
      containers:
        - name: growthos-api
          image: ammarrepo/growthos-backend:81effb8cc46196c616b9ae2955e0121cab19348e
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: DATABASE_URL # The variable name inside your container
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets # The name of your Secret
                  key: DATABASE_URL
            - name: JWT_ACCESS_SECRET # The variable name inside your container
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets # The name of your Secret
                  key: JWT_ACCESS_SECRET
            - name: JWT_REFRESH_SECRET # The variable name inside your container
              valueFrom:
                secretKeyRef:
                  name: jwt-secrets # The name of your Secret
                  key: JWT_REFRESH_SECRET
            - name: CORS_ORIGIN
              value: 'http://localhost:8080'
            - name: COOKIE_SECURE
              value: 'true'
            - name: NODE_ENV
              value: 'development'
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: growthos
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: growthos-api
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
