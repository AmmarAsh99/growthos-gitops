apiVersion: batch/v1
kind: Job
metadata:
  name: db-push
  namespace: growthos
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ['sh', '-c']
          args:
            - |
              until pg_isready -h postgres -p 5432; do
                echo "waiting for db..."
                sleep 2
              done
      containers:
        - name: db-push
          image: ammarrepo/growthos-db-push:873013ea73e7b3d6cde3f02a5bb79de5fe4d2f8b
          env:
            - name: DATABASE_URL # The variable name inside your container
              valueFrom:
                secretKeyRef:
                  name: postgres-secrets # The name of your Secret
                  key: DATABASE_URL
          command: ['npm', 'run', 'db:migrate']
      restartPolicy: Never
  backoffLimit: 4
