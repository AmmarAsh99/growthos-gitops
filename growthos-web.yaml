apiVersion: apps/v1
kind: Deployment
metadata:
  name: growthos-web-deployment
  labels:
    app: growthos-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: growthos-web
  template:
    metadata:
      labels:
        app: growthos-web
    spec:
      containers:
        - name: growthos-web
          image: ammarrepo/growthos-frontend:81effb8cc46196c616b9ae2955e0121cab19348e
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: growthos-web
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
